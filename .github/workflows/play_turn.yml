name: Process Minesweeper Turn

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process-turn:
    if: startsWith(github.event.issue.title, 'move:') || github.event.issue.title == 'reset'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Process Move or Reset
        run: |
          python scripts/engine.py "${{ github.event.issue.title }}" "${{ github.repository }}" "${{ github.actor }}"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md state/game.json
          git commit -m "Process turn: ${{ github.event.issue.title }}" || exit 0
          git push

      - name: Close Issue Automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --comment "Turn processed and board updated!"